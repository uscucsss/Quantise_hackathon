<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дашборд Статистики | CONFESSION</title>
    <link rel="stylesheet" href="../src/css/dashboard/index.css">
</head>
<body class="dashboard-body">
    <div class="bg-glow-glow"></div>
    <div class="dashboard-wrapper">
        <header class="dashboard-header">
            <h1 class="header-title">СТАТИСТИКА ПРОХОЖДЕНИЯ</h1>
            <p class="header-subtitle">АНАЛИЗ ОПЕРАЦИОННОЙ ЭФФЕКТИВНОСТИ QUANTISE</p>
        </header>
        <section class="metrics-grid">
            <div class="metric-card">
                <span class="metric-label">Время сессии</span>
                <span class="metric-value">14:22 <small>мин</small></span>
            </div>
            <div class="metric-card">
                <span class="metric-label">Уровень стабильности</span>
                <span class="metric-value" id="stability-value-label">...</span>
            </div>
        </section>
        <section class="profile-section">
            <h2 class="section-title">Профиль переговорщика</h2>
            <div class="skills-container">
                <div class="skill-item">
                    <div class="skill-info">
                        <span class="skill-name" style="color: #00ff88;">[ АНАЛИТИК ]</span>
                        <span class="skill-percent">0%</span>
                    </div>
                    <div class="skill-bar-bg"><div class="skill-bar bar-analytics"></div></div>
                </div>
                <div class="skill-item">
                    <div class="skill-info">
                        <span class="skill-name" style="color: #ff3b3b;">[ БОЕЦ ]</span>
                        <span class="skill-percent">0%</span>
                    </div>
                    <div class="skill-bar-bg"><div class="skill-bar bar-fighter"></div></div>
                </div>
                <div class="skill-item">
                    <div class="skill-info">
                        <span class="skill-name" style="color: #00b4d8;">[ ДИПЛОМАТ ]</span>
                        <span class="skill-percent">0%</span>
                    </div>
                    <div class="skill-bar-bg"><div class="skill-bar bar-diplomat"></div></div>
                </div>
                <div class="skill-item">
                    <div class="skill-info">
                        <span class="skill-name" style="color: #ffb800;">[ ХАРИЗМАТИК ]</span>
                        <span class="skill-percent">0%</span>
                    </div>
                    <div class="skill-bar-bg"><div class="skill-bar bar-charismatic"></div></div>
                </div>
            </div>
        </section>
        <footer class="dashboard-footer">
            <button type="button" id="replay-game-btn" class="dashboard-btn btn-replay">
                <span>Переиграть</span>
            </button>
            <button type="button" id="back-to-menu-btn" class="dashboard-btn btn-return">
                <span>В меню</span>
            </button>
        </footer>
    </div>
    <script src="../src/js/dashboard/index.js"></script>
</body>
</html>
