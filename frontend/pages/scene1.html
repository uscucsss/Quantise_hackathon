<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONFESSION — Симуляция</title>
    <link rel="stylesheet" href="../src/css/pages/scene1/index.css">
</head>
<body>
    <div class="animated-bg">
        <div class="bg-glow-particle particle-1"></div>
        <div class="bg-glow-particle particle-2"></div>
        <div class="nano-particle p1"></div>
        <div class="nano-particle p2"></div>
        <div class="nano-particle p3"></div>
        <div class="nano-particle p4"></div>
        <div class="nano-particle p5"></div>
        <div class="nano-particle p6"></div>
        <div class="nano-particle p7"></div>
        <div class="nano-particle p8"></div>
    </div>
    <div class="fullscreen-app">
        <div class="top-section">
            <div class="visual-area">
                <button class="exit-app-btn" id="save-exit-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px; transform: translateY(1px);"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                    Сохранить и выйти
                </button>
                <div class="neon-sphere-wrapper">
                    <div class="neon-orbit pulse"></div>
                    <div class="neon-sphere"></div>
                </div>
                <div class="employer-avatar">
                    <div class="cyber-scan-line"></div>
                    <div class="avatar-core">AI</div>
                    <div class="avatar-glow-ring"></div>
                </div>
            </div>
            <div class="answers-sidebar">
                <div class="answers-grid" id="choices-container"></div>
                <div class="sidebar-action-zone">
                    <button class="select-action-btn" id="main-submit-btn" disabled>
                        Выберите стратегию поведения
                    </button>
                </div>
            </div>
        </div>
        <div class="bottom-dialogue-bar">
            <div class="dialogue-card-glass">
                <div class="speaker-badge" id="boss-name">Работодатель</div>
                <p class="dialogue-text-content" id="boss-speech">Загрузка вопроса сценария...</p>
            </div>
        </div>
    </div>
    <script src="../src/js/scene1/scene1.js"></script>
</body>
</html>
